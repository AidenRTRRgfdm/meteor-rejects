plugins {
	id 'java'
	id 'net.fabricmc.fabric-loom' version '1.17.21'
}

java {
    withSourcesJar()
	toolchain {
		languageVersion = JavaLanguageVersion.of(25)
	}
}

base {
	archivesName = project.archives_base_name
}
version = project.mod_version
group = project.maven_group

repositories {
	mavenLocal()
	mavenCentral()
	maven { url "https://maven.meteordev.org/releases"}
	maven { url "https://maven.meteordev.org/snapshots" }
	maven { url "https://maven.seedfinding.com/" }
	maven { url "https://maven-snapshots.seedfinding.com/" }
	maven { url 'https://jitpack.io' }
}

loom {
	accessWidenerPath = file("src/main/resources/meteor-rejects.accesswidener")
}

configurations {
	// configuration that holds jars to include in the jar
	extraLibs
}

dependencies {
	// Exact upstream release artifacts; the original Maven host is unavailable.
	// Each platform's native library is selected automatically at runtime.
	extraLibs files('libs/cubiomes/cubiomes-1.22.3.jar',
		'libs/cubiomes/cubiomes-1.22.3-linux64.jar',
		'libs/cubiomes/cubiomes-1.22.3-osx.jar',
		'libs/cubiomes/cubiomes-1.22.3-windows64.jar')
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"

	implementation("meteordevelopment:meteor-client:${project.meteor_version}")
    compileOnly "meteordevelopment:baritone:${project.baritone_version}"
    compileOnly "net.fabricmc.fabric-api:fabric-resource-loader-v1:2.0.13+9edec1269e"

	// seed .locate and ore sim
	extraLibs('com.seedfinding:mc_math:ffd2edcfcc0d18147549c88cc7d8ec6cf21b5b91') { transitive = false }
	extraLibs('com.seedfinding:mc_seed:1ead6fcefe7e8de4b3d60cd6c4e993f1e8f33409') { transitive = false }
	extraLibs('com.seedfinding:mc_core:1.210.0') { transitive = false }
	extraLibs('com.seedfinding:mc_noise:7e3ba65e181796c4a2a1c8881d840b2254b92962') { transitive = false }
	extraLibs('com.seedfinding:mc_biome:41a42cb9019a552598f12089059538853e18ec78') { transitive = false }
	extraLibs('com.seedfinding:mc_terrain:b4246cbd5880c4f8745ccb90e1b102bde3448126') { transitive = false }
	extraLibs('com.seedfinding:mc_feature:919b7e513cc1e87e029a9cd703fc4e2dc8686229') { transitive = false }

	// seedcracker api
	implementation (include('com.github.19MisterX98.SeedcrackerX:seedcrackerx-api:2.10.1')) {transitive = false}
//	implementation (include('com.github.19MisterX98.SeedcrackerX:seedcrackerx-api:master-SNAPSHOT')) {transitive = false}

	// Exploit Preventer (optional)
	compileOnly("com.nikoverflow:exploit-preventer-api:0.0.1")

	configurations.implementation.extendsFrom(configurations.extraLibs)
}

processResources {
	inputs.property "version", project.version


	filesMatching("fabric.mod.json") {
		expand "version": project.version,
				"mc_version": project.minecraft_version,
				"gh_hash": (System.getenv("GITHUB_SHA") ?: "")
	}
}

jar {
	from('libs/cubiomes') {
		include 'LICENSE-*', 'NOTICE.txt'
		into 'META-INF/licenses/cubiomes'
	}
	from("LICENSE") {
		rename { "${it}_${project.archives_base_name}" }
	}
	from {
		configurations.extraLibs.collect { it.isDirectory() ? it : zipTree(it) }
	}
}
tasks.withType(Jar).configureEach {
	duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

tasks.withType(JavaCompile).configureEach {
	// ensure that the encoding is set to UTF-8, no matter what the system default is
	// this fixes some edge cases with special characters not displaying correctly
	// see http://yodaconditions.net/blog/fix-for-java-file-encoding-problems-with-gradle.html
	// If Javadoc is generated, this must be specified in that task too.
	it.options.encoding = "UTF-8"

	// Minecraft 26.2 requires Java 25.
	def targetVersion = 25
	if (JavaVersion.current().isJava9Compatible()) {
		 it.options.release = targetVersion
	}
}

// Disposable local client tests; their mod and dependencies never enter the release JAR.
if (providers.gradleProperty('clientTests').isPresent()) {
    dependencies {
        implementation 'net.fabricmc.fabric-api:fabric-api:0.160.0+26.2'
        if (providers.gradleProperty("withBaritone").isPresent()) {
            runtimeOnly "meteordevelopment:baritone:${project.baritone_version}"
        }
    }
    fabricApi {
        configureTests {
            createSourceSet = true
            modId = 'meteor-rejects-gametest'
            enableGameTests = false
            enableClientGameTests = true
            eula = true
        }
    }
}
